<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>李政学&amp;旷小伟婚礼请帖</title>
<meta name="description" content="李政学 & 旷小伟 诚挚邀请您见证我们的幸福时刻">
<meta property="og:title" content="李政学&旷小伟婚礼请帖">
<meta property="og:description" content="诚挚邀请您见证我们的幸福时刻">
<meta property="og:type" content="website">
<meta property="og:image" content="https://lizhengxue520.github.io/wedding-invitation/assets/share-thumb.jpg">
<meta itemprop="image" content="https://lizhengxue520.github.io/wedding-invitation/assets/share-thumb.jpg">
<style>
  :root{
    --ivory:#FBF5EC;
    --champagne:#F3E4CE;
    --blush:#E9B8B5;
    --blush-deep:#D89A9B;
    --gold:#B9915A;
    --ink:#4A3B32;
    --ink-soft:#8A7568;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 85% -5%, rgba(233,184,181,.35), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(201,169,110,.22), transparent 55%),
      radial-gradient(1000px 700px at 110% 75%, rgba(233,184,181,.28), transparent 60%),
      linear-gradient(180deg, var(--ivory) 0%, var(--champagne) 100%);
    min-height:100vh;
    overflow-x:hidden;
  }
  .page{max-width:560px;margin:0 auto;padding:0 22px 72px;position:relative;z-index:2}

  /* ---------- 飘落花瓣 ---------- */
  .petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .petal{
    position:absolute;top:-6vh;
    width:16px;height:16px;
    background:radial-gradient(circle at 30% 30%, #F6D3D0, var(--blush));
    border-radius:80% 0 80% 0;
    opacity:.65;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translate3d(0,-6vh,0) rotate(0deg)}
    100%{transform:translate3d(var(--sway,40px),106vh,0) rotate(340deg)}
  }

  /* ---------- 顶部 ---------- */
  .hero{text-align:center;padding:64px 0 34px}
  .hero .eyebrow{
    font-size:12px;letter-spacing:.42em;color:var(--gold);
    text-transform:uppercase;margin-bottom:18px;
  }
  .hero .divider{
    width:56px;height:1px;background:var(--gold);margin:0 auto 26px;
    position:relative;
  }
  .hero .divider::after{
    content:"❧";position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);background:transparent;
    color:var(--gold);font-size:13px;padding:0 8px;
  }
  .hero h1{
    font-size:34px;font-weight:600;letter-spacing:.08em;line-height:1.5;
  }
  .hero h1 .amp{
    font-family:Georgia,serif;font-style:italic;color:var(--gold);
    font-size:26px;padding:0 6px;
  }
  .hero .sub{
    margin-top:16px;font-size:15px;color:var(--ink-soft);letter-spacing:.18em;
  }
  .hero .date{
    margin-top:10px;font-size:13px;letter-spacing:.3em;color:var(--gold);
  }

  /* ---------- 卡片通用 ---------- */
  .card{
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(8px);
    border:1px solid rgba(185,145,90,.25);
    border-radius:20px;
    padding:20px;
    box-shadow:0 12px 40px rgba(185,145,90,.14);
    margin-top:28px;
  }
  .card-title{
    text-align:center;font-size:17px;letter-spacing:.28em;color:var(--ink);
    margin-bottom:4px;
  }
  .card-title small{
    display:block;font-size:10px;letter-spacing:.34em;color:var(--gold);
    margin-top:6px;text-transform:uppercase;font-family:Georgia,serif;
  }

  /* ---------- 视频 ---------- */
  .video-wrap{
    margin-top:16px;border-radius:14px;overflow:hidden;
    box-shadow:0 8px 24px rgba(74,59,50,.18);
    background:#000;
  }
  video{display:block;width:100%;height:auto}

  /* ---------- 问卷 ---------- */
  .form-wrap{
    margin-top:16px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(185,145,90,.2);
    background:#fff;
  }
  .form-wrap iframe{
    width:100%;height:640px;border:0;display:block;
  }
  .form-tip{
    text-align:center;font-size:12px;color:var(--ink-soft);
    margin-top:12px;line-height:1.9;
  }
  .form-tip a{
    color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(185,145,90,.4);
  }
  .qr-fallback{
    display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;
  }
  .qr-fallback img{
    width:86px;height:86px;object-fit:cover;border-radius:10px;
    border:1px solid rgba(185,145,90,.3);
  }
  .qr-fallback span{font-size:12px;color:var(--ink-soft);line-height:1.8}

  /* ---------- 尾注 ---------- */
  .footer{
    text-align:center;margin-top:44px;color:var(--ink-soft);
    font-size:13px;letter-spacing:.14em;line-height:2.2;
  }
  .footer .names{
    font-family:Georgia,serif;font-style:italic;font-size:16px;color:var(--gold);
    letter-spacing:.06em;
  }

  /* ---------- 时间地点 ---------- */
  .info{text-align:center;margin-top:14px}
  .info-date{
    font-size:22px;letter-spacing:.12em;color:var(--ink);font-weight:600;
  }
  .info-date span{
    font-size:13px;color:var(--gold);letter-spacing:.2em;margin-left:8px;
  }
  .info-lunar{font-size:12px;color:var(--ink-soft);margin-top:6px;letter-spacing:.2em}
  .info-addr{
    margin-top:14px;font-size:15px;line-height:1.9;color:var(--ink);letter-spacing:.06em;
  }
  .info-addr small{display:block;font-size:12px;color:var(--ink-soft);letter-spacing:.18em;margin-bottom:2px}
  .map-btn{
    display:inline-block;margin-top:16px;padding:10px 28px;
    border-radius:999px;text-decoration:none;
    background:linear-gradient(135deg,var(--gold),#D3B078);
    color:#fff;font-size:13px;letter-spacing:.22em;
    box-shadow:0 6px 18px rgba(185,145,90,.35);
  }
  .map-btn:active{transform:scale(.96)}

  /* ---------- 音乐按钮 ---------- */
  .music-btn{
    position:fixed;top:18px;right:18px;z-index:50;
    width:46px;height:46px;border-radius:50%;
    border:2px solid rgba(255,255,255,.9);
    box-shadow:0 4px 16px rgba(74,59,50,.28);
    background-image:url("assets/share-thumb.jpg");
    background-size:cover;background-position:center;
    cursor:pointer;padding:0;
    animation:spin 6s linear infinite;
    animation-play-state:paused;
  }
  .music-btn::after{
    content:"";position:absolute;left:50%;top:50%;
    width:10px;height:10px;border-radius:50%;
    background:rgba(255,255,255,.95);
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 2px rgba(185,145,90,.5);
  }
  .music-btn.playing{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 微信转发封面图（隐藏，微信抓取缩略图用） -->
<img src="assets/share-thumb.jpg" alt="" style="position:absolute;width:0;height:0;top:-9999px;overflow:hidden">

<!-- 背景音乐 -->
<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>
<button class="music-btn" id="musicBtn" aria-label="播放/暂停背景音乐"></button>

<!-- 飘落花瓣 -->
<div class="petals" id="petals"></div>

<div class="page">

  <!-- 顶部标题 -->
  <header class="hero">
    <p class="eyebrow">Wedding Invitation</p>
    <div class="divider"></div>
    <h1>李政学<span class="amp">&amp;</span>旷小伟</h1>
    <p class="sub">婚礼请帖</p>
    <p class="date">2026 . 10 . 01 · 诚挚邀请您见证我们的幸福时刻</p>
  </header>

  <!-- 视频 -->
  <section class="card">
    <h2 class="card-title">爱的影像<small>Our Moments</small></h2>
    <div class="video-wrap">
      <video src="assets/video.mp4" poster="assets/cover.jpg"
             controls playsinline webkit-playsinline preload="metadata"></video>
    </div>
  </section>

  <!-- 时间地点 -->
  <section class="card">
    <h2 class="card-title">婚礼时间 · 地点<small>When &amp; Where</small></h2>
    <div class="info">
      <p class="info-date">2026年10月1日<span>星期四 · 国庆节</span></p>
      <p class="info-addr"><small>婚礼地址</small>湖南省衡阳市衡山县贯塘茶场</p>
      <a class="map-btn" href="https://uri.amap.com/search?keyword=%E6%B9%96%E5%8D%97%E7%9C%81%E8%A1%A1%E9%98%B3%E5%B8%82%E8%A1%A1%E5%B1%B1%E5%8E%BF%E8%B4%AF%E5%A1%98%E8%8C%B6%E5%9C%BA&callnative=1" target="_blank" rel="noopener">点击查看地图导航</a>
    </div>
  </section>

  <!-- 问卷星出席登记 -->
  <section class="card">
    <h2 class="card-title">莅临登记<small>RSVP</small></h2>
    <div class="form-wrap">
      <iframe src="https://www.wjx.top/vm/tlMbf84.aspx" loading="lazy"
              title="婚礼出席信息登记"></iframe>
    </div>
    <p class="form-tip">
      若表单无法正常显示，<a href="https://www.wjx.top/vm/tlMbf84.aspx" target="_blank" rel="noopener">点此打开登记页面</a>
    </p>
    <div class="qr-fallback">
      <img src="assets/wjx-qr.jpg" alt="问卷星二维码">
      <span>也可以微信扫码<br>填写出席信息</span>
    </div>
  </section>

  <!-- 尾注 -->
  <footer class="footer">
    <p class="names">Zhengxue &amp; Xiaowei</p>
    <p>愿与您分享这份喜悦<br>期待您的到来</p>
  </footer>

</div>

<script>
(function(){
  /* 花瓣 */
  var petals = document.getElementById('petals');
  for (var i = 0; i < 10; i++) {
    var p = document.createElement('div');
    p.className = 'petal';
    var size = 10 + Math.random() * 12;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.setProperty('--sway', (Math.random() * 160 - 80) + 'px');
    p.style.animationDuration = (9 + Math.random() * 9) + 's';
    p.style.animationDelay = (-Math.random() * 18) + 's';
    p.style.opacity = 0.35 + Math.random() * 0.4;
    petals.appendChild(p);
  }

  /* 背景音乐：自动播放失败则在首次触摸/点击时播放 */
  var bgm = document.getElementById('bgm');
  var btn = document.getElementById('musicBtn');
  function play(){
    bgm.play().then(function(){
      btn.classList.add('playing');
    }).catch(function(){ btn.classList.remove('playing'); });
  }
  play();
  var once = function(){
    if (bgm.paused) play();
    document.removeEventListener('touchstart', once);
    document.removeEventListener('click', once);
  };
  document.addEventListener('touchstart', once, {passive:true});
  document.addEventListener('click', once);
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if (bgm.paused) { play(); }
    else { bgm.pause(); btn.classList.remove('playing'); }
  });
})();
</script>
</body>
</html>
